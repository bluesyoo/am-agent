spring:
  application:
    instance-id: agent
    locale: ko-KR
    name: am-agent
  profiles:
    active: global

---
spring:
  config:
    activate:
      on-profile: global

  data:
    redis:
      cluster:
        lettuce:
          pool:
            max-active: 8               # 동시에 사용할 수 있는 최대 커넥션 수 (기본 -1 = 무제한)
            max-idle: 8                 # idle 상태로 유지될 수 있는 최대 커넥션 수
            min-idle: 1                 # 최소 idle 커넥션 수 (풀 유지용)
            max-wait: 1000              # 커넥션 부족 시 대기 최대 시간(ms), 기본 -1 = 무제
        max-redirects: 3
        nodes:
          - redis-node-1:7001
          - redis-node-2:7002
          - redis-node-3:7003
          - redis-node-4:7004
          - redis-node-5:7005
          - redis-node-6:7006
        password: gnirpszib
        timeout: 3000                   # 명령 실행 타임아웃(ms), 기본 무제한 → 3초로 제한

  jackson:
    property-naming-strategy: SNAKE_CASE

  kafka:
    bootstrap-servers:
      - localhost:9092
      - localhost:9093
      - localhost:9094
    client-id: am-client                # 클라이언트 식별자 (로깅 등 추적용)
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest       # [earliest|latest]
      enable-auto-commit: false         # 수동 커밋 권장
      group-id: am-group                # Kafka consumer group ID
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                         # all: 리더 + 팔로워 모두 ack
      batch-size: 16384                 # 배치 전송 크기 (바이트)
      buffer-memory: 33554432           # 버퍼 메모리 (바이트)
      linger-ms: 1                      # 지정 시간(ms) 내 대기 후 배치 전송
      retries: 3                        # 전송 실패 시 재시도 횟수
    listener:
      ack-mode: manual_immediate        # 수동 ack (manual 또는 manual_immediate)
      concurrency: 1                    # Consumer 동시 실행 수
      enabled: true
      missing-topics-fatal: false
      type: single
    properties:
      security.protocol: PLAINTEXT      # SASL/SSL 등 보안 설정 가능

logging:
  config: classpath:./log4j2-devel.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: am-agent             # 앱 이름 태그 (대시보드에서 구분 가능)
      
opensearch:
  uris: https://localhost:9200
  username: admin
  password: Gnirpszib0)
  connect-timeout: 3000
  socket-timeout: 30000
  max-conn-total: 30
  max-conn-per-route: 10
  ssl:
    enabled: true

app:
  project:
    namespace: adm
